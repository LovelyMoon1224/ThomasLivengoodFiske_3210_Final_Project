  <html>
  <head>
    <title>Howdy Lil Lady</title>
  </head>
  <body>
    <!-- Three.js Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/+esm"
        }
      }
    </script>

    <script type="module">
        const scene = new THREE.Scene();

      // Initialize renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setClearColor(0x111111, 1.0); // Dark grey background
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const testLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(testLight);

        const geometry = new THREE.BoxGeometry(10,10,10);
        const material1 = new THREE.MeshBasicMaterial({ color: 0x00ff00});
        const material2 = new THREE.MeshBasicMaterial({ color: 0xffff00});
        const playerOneBox = new THREE.Mesh(geometry, material1);
        const playerTwoBox = new THREE.Mesh(geometry, material2);
        scene.add(playerOneBox);
        scene.add(playerTwoBox);

        const ws = new WebSocket('ws://10.2.130.183:5551'); //Change to host machines ipv4
        let myId = null;

        let localBox = playerOneBox;
        let remoteBox = playerTwoBox;

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === 'init') {
                myId = msg.id;
                console.log('I am player', myId);

                if (myId === 1) {
                    localBox = playerTwoBox;
                    remoteBox = playerOneBox;
                }
            }
            if (msg.type === 'msg') {
                const pos = JSON.parse(msg.data);
                remoteBox.position.x = pos.x;
            }
        };

        const camera = new THREE.PerspectiveCamera(
            35,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 0, 500); // Position the camera along the +Z axis
        camera.lookAt(new THREE.Vector3(1, 0, 0));
        scene.add(camera);

        let aPressed = false;
        let dPressed = false;

        document.addEventListener("keydown", function(event) {
            if (event.key === "a") {
                aPressed = true;
            }   
            if (event.key === "d") {
                dPressed = true;
            }
        });

        document.addEventListener("keyup", function(event) {
            if (event.key === "a") {
                aPressed = false;
            }
            if (event.key === "d") {
                dPressed = false;
            }
        });

        function boxMovement(a, d) {
            if (a) {
                localBox.position.x -= 2;
            }
            if (d) {
                localBox.position.x += 2;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            boxMovement(aPressed, dPressed);

            if (ws.readyState === WebSocket.OPEN && myId !== null && myId < 3) {
                ws.send(JSON.stringify({ x: localBox.position.x }));
            }

            renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
