  <html>
  <head>
    <title>Almost Minecraft Creative Mode</title>
  </head>
  <body>
    <!-- Three.js Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/+esm"
        }
      }
    </script>

    <script type="module">
      const scene = new THREE.Scene();

      // Initialize renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setClearColor(0x111111, 1.0); // Dark grey background
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const testLight = new THREE.AmbientLight(0xffffff, 1.0);
      scene.add(testLight);

      const geometry = new THREE.BoxGeometry(10,10,10);
      const material = new THREE.MeshBasicMaterial({ color: 0x00ff00});
      const box = new THREE.Mesh(geometry, material);
      scene.add(box);

      const camera = new THREE.PerspectiveCamera(
        35,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 0, 500); // Position the camera along the +Z axis
      camera.lookAt(new THREE.Vector3(1, 0, 0));
      scene.add(camera);

      let aPressed = false;
      let dPressed = false;

    document.addEventListener("keydown", function(event) {

      if(event.key === "a") {
          aPressed = true;
      }
      if(event.key === "d") {
          dPressed = true;
      }
    });

    document.addEventListener("keyup", function(event) {

      if(event.key === "a") {
          aPressed = false;
      }
      if(event.key === "d") {
          dPressed = false;
      }
    });

      function boxMovement(a,d) {
        if (a) {
            box.position.x -=2;
        }
        if (d) {
            box.position.x +=2;
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        
        boxMovement(aPressed, dPressed);

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
